<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">

<title>PROFavalia 1.º Ciclo — versão 2.6.0</title>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--ink:#1f2937;--muted:#667085;--line:#dfe4ea;
  --primary:#3157d5;--primary2:#2547b7;--pt:#8b5cf6;--mat:#0e9f6e;--em:#e68a00;
  --danger:#c73636;--shadow:0 8px 24px rgba(31,41,55,.08);--radius:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:#172033;color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:10px 10px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
.brand h1{font-size:18px;margin:0 0 5px}.brand p{font-size:12px;color:#b8c0d0;margin:0}
.nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#8791a5;margin:18px 10px 7px}
.nav-btn{width:100%;border:0;background:transparent;color:#dce2ee;text-align:left;border-radius:10px;padding:11px 12px;margin:3px 0;display:flex;gap:10px;align-items:center}
.nav-btn:hover,.nav-btn.active{background:#2a3650;color:#fff}
.nav-btn.pt.active{box-shadow:inset 4px 0 var(--pt)} .nav-btn.mat.active{box-shadow:inset 4px 0 var(--mat)} .nav-btn.em.active{box-shadow:inset 4px 0 var(--em)}
.sidebar-footer{font-size:11px;color:#8f9ab0;margin:24px 10px}
.main{min-width:0}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.topbar-left h2{font-size:20px;margin:0}.topbar-left small{color:var(--muted)}
.top-actions{display:flex;gap:9px;align-items:center}
.content{padding:22px 24px 40px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;color:var(--ink)}
.btn:hover{background:#f8fafc}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary2)}
.btn.danger{color:var(--danger);border-color:#f0caca}.btn.small{padding:6px 9px;font-size:12px}.btn.ghost{background:transparent}
.icon-btn{border:0;background:transparent;border-radius:7px;padding:5px 7px;color:var(--muted)}.icon-btn:hover{background:#eef2f7;color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.toolbar{padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid #ccd3dc;border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #cdd8ff;border-color:var(--primary)}
.search{min-width:220px}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:#eef2f7;color:#475467}
.badge.pt{background:#f1eafe;color:#6840b6}.badge.mat{background:#e4f7ef;color:#08775a}.badge.em{background:#fff1d8;color:#a55e00}
.badge.mb{background:#dff4e9;color:#176a45}.badge.b{background:#e3f0ff;color:#28598a}.badge.s{background:#fff1c7;color:#865f00}.badge.i{background:#ffe3d2;color:#9b3f17}.badge.f{background:#f9dada;color:#9f1c1c}
.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px}.kpi strong{font-size:26px;display:block;margin-top:7px}.kpi small{color:var(--muted)}
.table-wrap{overflow:auto;border-radius:var(--radius);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 9px;font-size:12px;text-align:center;white-space:nowrap}
th{background:#f8fafc;font-weight:700;position:sticky;top:0;z-index:5}
tr:last-child td{border-bottom:0} th:last-child,td:last-child{border-right:0}
.sticky-num{position:sticky;left:0;z-index:6;background:#fff;min-width:48px}.sticky-name{position:sticky;left:48px;z-index:6;background:#fff;min-width:210px;text-align:left}
th.sticky-num,th.sticky-name{background:#f0f3f7;z-index:8}
tbody tr:hover td{background:#fafcff} tbody tr:hover .sticky-num,tbody tr:hover .sticky-name{background:#f5f8ff}
.subject-head.pt{background:#f5f0ff;color:#6540a8}.subject-head.mat{background:#eaf8f2;color:#08755a}.subject-head.em{background:#fff4e1;color:#a45f00}
.score-cell{cursor:pointer;min-width:94px}.score-cell:hover{outline:2px solid #b8c7ff;outline-offset:-2px}
.score-main{font-weight:700}.score-sub{font-size:10px;color:var(--muted);margin-top:2px}
.filters-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;align-items:end}
.checks{display:flex;gap:12px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:5px;font-size:13px}
.assessment-picker{padding:12px 14px;margin-bottom:14px}.assessment-picker summary{cursor:pointer;font-weight:700}.assessment-list{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:7px;margin-top:12px}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:16px}.page-header h3{font-size:24px;margin:0 0 5px}.page-header p{margin:0;color:var(--muted)}
.assessment-grid{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:14px}
.assessment-card{padding:16px;position:relative;border-top:4px solid #d6dbe3}.assessment-card.pt{border-top-color:var(--pt)}.assessment-card.mat{border-top-color:var(--mat)}.assessment-card.em{border-top-color:var(--em)}
.assessment-card h4{margin:9px 0 6px;font-size:16px}.assessment-card p{color:var(--muted);font-size:12px;margin:0 0 14px}.card-actions{display:flex;gap:6px;flex-wrap:wrap}
.progress{height:7px;background:#edf0f4;border-radius:99px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--primary)}
.empty{padding:45px;text-align:center;color:var(--muted)}
.students-table{width:100%}.students-table td,.students-table th{text-align:left}.students-table td.actions{text-align:right}
.student-layout{display:grid;grid-template-columns:260px 1fr;gap:16px}.student-side{padding:14px;height:max-content}.student-side select{width:100%}.student-main{display:flex;flex-direction:column;gap:14px}
.student-hero{padding:18px;display:flex;justify-content:space-between;align-items:center}.student-hero h3{margin:0 0 5px}.student-hero p{margin:0;color:var(--muted)}
.subject-panel{padding:16px}.subject-panel h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.student-results{width:100%;max-width:none}.student-results th,.student-results td{text-align:left}.student-results td:nth-last-child(-n+2){text-align:center}
.notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notes-grid textarea{min-height:100px;resize:vertical}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:16px;width:min(900px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.modal.large{width:min(1200px,98vw)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}
.modal-body{padding:18px;overflow:auto}.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form-grid .wide{grid-column:1/-1}
.criteria-row{display:grid;grid-template-columns:1fr 110px 38px;gap:8px;margin:7px 0}
.scoring-table input[type=number]{width:76px;padding:6px}.scoring-table input[type=text]{min-width:160px;padding:6px}.scoring-table select{padding:6px}
.hidden{display:none!important}.muted{color:var(--muted)}.warning{background:#fff8e7;border:1px solid #f3dfa3;padding:10px 12px;border-radius:9px;font-size:12px}
.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow);z-index:150;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
.mobile-nav{display:none}
@media(max-width:900px){
 .app{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:flex;gap:5px;overflow:auto;padding:8px 12px;background:#172033;position:sticky;top:70px;z-index:19}.mobile-nav button{white-space:nowrap;background:#2a3650;color:#fff;border:0;border-radius:8px;padding:8px 10px}
 .summary-grid{grid-template-columns:repeat(2,1fr)}.assessment-grid{grid-template-columns:1fr}.student-layout{grid-template-columns:1fr}.filters-grid{grid-template-columns:1fr 1fr}.assessment-list{grid-template-columns:1fr}

}
@media(max-width:560px){.summary-grid,.filters-grid,.notes-grid,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.topbar-left small{display:none}}

.version-chip{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:#2a3650;color:#dce2ee;font-size:10px;margin-top:7px}
.inovar-layout{display:grid;grid-template-columns:320px 1fr;gap:16px}.phrase-list{display:flex;flex-direction:column;gap:7px}.phrase-row{display:grid;grid-template-columns:1fr 36px;gap:6px}.phrase-row input{width:100%}.inovar-text{min-height:190px;resize:vertical}.overview-text{white-space:normal;min-width:260px;text-align:left;line-height:1.35}.save-indicator{font-size:11px;color:var(--muted);padding:0 4px}.export-options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.chart-note{font-size:12px;color:var(--muted);line-height:1.45}.comment-summary{display:flex;flex-direction:column;gap:8px}.comment-item{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fafbfc}.comment-item strong{display:block;margin-bottom:4px}.comment-item p{margin:0;white-space:pre-wrap}.top-file-label{display:inline-flex;align-items:center}
@media(max-width:900px){.inovar-layout{grid-template-columns:1fr}.export-options{grid-template-columns:1fr}.top-actions .compact-hide{display:none}}

  if(p>=Number(t.MB))return'MB';if(p>=Number(t.B))return'B';if(p>=Number(t.S))return'S';if(p>=Number(t.I))return'I';return'F'

function percent(a,sid){
  const r=resultRecord(a,sid);if(!r||r.status&&r.status!=='normal')return null;

  if(r.overridePercent!==''&&r.overridePercent!=null&&!Number.isNaN(Number(r.overridePercent)))return Number(r.overridePercent);

    let got=0,max=0,has=false;
    a.criteria.forEach(c=>{max+=Number(c.max)||0;const v=r.items?.[c.id];if(v!==''&&v!=null){got+=Number(v)||0;has=true}});
    return has&&max?got/max*100:null;
  }
  if(r.value===''||r.value==null)return null;
  return Number(r.value)/(Number(a.maxScore)||100)*100;
}
function qualitative(a,sid){

function subjectAverage(subject,sid,period='all'){
  const list=allAssessments().filter(a=>a.subject===subject&&(period==='all'||String(a.period)===String(period)));
  const pairs=list.map(a=>{const v=a.scale==='numeric'?percent(a,sid):({MB:95,B:80,S:60,I:35,F:10}[qualitative(a,sid)]??null);return{v,w:Math.max(0,Number(a.weight)||0)}}).filter(x=>x.v!=null);
  if(!pairs.length)return null;
  const weighted=period!=='all'&&pairs.some(x=>x.w>0);
  if(weighted){const den=pairs.reduce((n,x)=>n+x.w,0);return den?pairs.reduce((n,x)=>n+x.v*x.w,0)/den:null}
  return pairs.reduce((n,x)=>n+x.v,0)/pairs.length
}

function buildGlobalMobile(students,groups){
  const cards=students.map(s=>`<div class="card mobile-student-card"><h4><button class="icon-btn" onclick="openStudent('${s.id}')">${s.number}. ${esc(s.name)}</button><span>${groups.map(g=>{const av=subjectAverage(g.subject,s.id,ui.global.period);return`<span class="badge ${g.subject}">${SUBJECTS[g.subject].short}: ${av==null?'—':av.toFixed(0)+'%'}</span>`}).join(' ')}</span></h4>${groups.map(g=>{const av=subjectAverage(g.subject,s.id,ui.global.period);return`<details><summary><strong class="badge ${g.subject}">${SUBJECTS[g.subject].name}</strong> <span class="muted">${g.items.length} avaliações · média ${av==null?'—':av.toFixed(1)+'%'}</span></summary>${g.items.map(a=>`<div class="mobile-result-row" onclick="openScoring('${a.id}','${s.id}')"><span>${esc(a.title)}</span><span>${resultText(a,s.id,ui.global.display)}</span></div>`).join('')}</details>`}).join('')}</div>`).join('');
  return `<div class="mobile-global">${cards||'<div class="card empty">Sem alunos.</div>'}</div>`
}
function studentInitials(name){return String(name||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?'}
function avatarHTML(student,size=''){return `<span class="avatar ${size}">${student?.photo?`<img src="${student.photo}" alt="">`:esc(studentInitials(student?.name))}</span>`}
function roomSeatIds(){const per=state.room.layout==='pairs'?2:1,total=state.room.rows*state.room.columns*per;return Array.from({length:total},(_,i)=>`seat_${i+1}`)}
function renderRoom(){
  setHeader('Visão da sala',`${state.meta.className} · lugares e avaliação rápida`,'⚙ Organizar sala',true);
  const assessments=allAssessments();if(!assessments.some(a=>a.id===ui.roomAssessmentId))ui.roomAssessmentId=assessments[0]?.id||'';
  const assess=state.assessments.find(a=>a.id===ui.roomAssessmentId),per=state.room.layout==='pairs'?2:1,ids=roomSeatIds(),assigned=new Set(Object.values(state.room.seats||{}).filter(Boolean));
  const groups=[];for(let g=0;g<state.room.rows*state.room.columns;g++){const seats=[];for(let k=0;k<per;k++){const seatId=ids[g*per+k],sid=state.room.seats[seatId],stu=activeStudents().find(x=>x.id===sid),click=stu&&ui.roomMode==='assessment'&&assess?`openRoomScore('${stu.id}','${assess.id}')`:`openSeatModal('${seatId}')`;seats.push(`<div class="seat ${stu?'':'empty'} ${stu&&ui.roomMode==='assessment'?'assess-seat':''}" onclick="${click}"><span class="seat-number">${g*per+k+1}</span>${stu?`${avatarHTML(stu)}<button class="icon-btn seat-name" onclick="event.stopPropagation();${ui.roomMode==='assessment'&&assess?`openRoomScore('${stu.id}','${assess.id}')`:`openStudent('${stu.id}')`}">${esc(stu.name)}</button>${ui.roomMode==='assessment'&&assess?`<span class="room-result">${resultText(assess,stu.id,'both')}</span>`:''}`:'<span>+ Atribuir aluno</span>'}</div>`)}groups.push(`<div class="desk-group" style="--desk-seats:${per}">${seats.join('')}</div>`)}
  const unassigned=activeStudents().filter(x=>!assigned.has(x.id));
  document.getElementById('content').innerHTML=`<div class="page-header"><div><h3>Planta da sala</h3><p>${ui.roomMode==='assessment'?'Toque num aluno para lançar rapidamente o resultado.':'Clique num lugar para atribuir ou trocar um aluno.'}</p></div><div class="data-actions"><button class="btn" onclick="openPrintModal('room')">🖨 Imprimir sala</button><button class="btn" onclick="openExportModal('room')">⬇ Exportar lugares</button><button class="btn primary" onclick="openRoomConfig()">⚙ Organizar</button></div></div><div class="card room-mode-bar"><div class="field"><label>Modo</label><select onchange="ui.roomMode=this.value;renderRoom()"><option value="seats" ${ui.roomMode==='seats'?'selected':''}>Organizar lugares</option><option value="assessment" ${ui.roomMode==='assessment'?'selected':''}>Avaliar pela sala</option></select></div><div class="field"><label>Avaliação rápida</label><select onchange="ui.roomAssessmentId=this.value;renderRoom()" ${ui.roomMode!=='assessment'?'disabled':''}>${assessments.map(a=>`<option value="${a.id}" ${a.id===ui.roomAssessmentId?'selected':''}>${SUBJECTS[a.subject].short} · ${a.period}.º · ${esc(a.title)}</option>`).join('')}</select></div>${assess?`<span class="badge ${assess.subject}">${esc(assess.title)}</span>`:''}</div><div class="room-stats"><span class="badge">${activeStudents().length} alunos</span><span class="badge">${assigned.size} com lugar</span><span class="badge">${unassigned.length} sem lugar</span></div><div class="card subject-panel" style="margin-top:12px"><div class="room-board">QUADRO / PROFESSOR</div><div class="room-grid" style="--room-cols:${state.room.columns}">${groups.join('')}</div></div><div class="card room-empty-list"><strong>Alunos sem lugar:</strong> ${unassigned.length?unassigned.map(x=>`<button class="btn small" onclick="${ui.roomMode==='assessment'&&assess?`openRoomScore('${x.id}','${assess.id}')`:`openStudent('${x.id}')`}">${esc(x.name)}</button>`).join(' '):'<span class="muted">Todos os alunos têm lugar atribuído.</span>'}</div>`;
}
function openRoomConfig(){modal(`<div class="modal-head"><h3>Organizar a sala</h3><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Filas</label><input id="roomRows" type="number" min="1" max="8" value="${state.room.rows}"></div><div class="field"><label>Carteiras por fila</label><input id="roomCols" type="number" min="1" max="8" value="${state.room.columns}"></div><div class="field wide"><label>Tipo de carteiras</label><select id="roomLayout"><option value="pairs" ${state.room.layout==='pairs'?'selected':''}>Duas a duas</option><option value="single" ${state.room.layout==='single'?'selected':''}>Individuais</option></select></div></div><div class="warning" style="margin-top:14px">Alterar o número de lugares não elimina alunos nem notas. As atribuições que deixarem de estar visíveis ficam guardadas até limpar a sala.</div></div><div class="modal-foot"><button class="btn danger" onclick="clearRoomAssignments()">Limpar lugares</button><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveRoomConfig()">Guardar</button></div>`)}
function saveRoomConfig(){state.room.rows=Math.min(8,Math.max(1,Number(document.getElementById('roomRows').value)||3));state.room.columns=Math.min(8,Math.max(1,Number(document.getElementById('roomCols').value)||3));state.room.layout=document.getElementById('roomLayout').value;saveState('Sala atualizada');closeModal();renderRoom()}
function clearRoomAssignments(){if(!confirm('Limpar todos os lugares atribuídos?'))return;state.room.seats={};saveState('Lugares limpos');closeModal();renderRoom()}
function openSeatModal(seatId){const current=state.room.seats[seatId]||'',stu=activeStudents().find(x=>x.id===current);modal(`<div class="modal-head"><h3>Atribuir lugar</h3><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="field"><label>Aluno</label><select id="seatStudent"><option value="">Lugar vazio</option>${activeStudents().map(s=>`<option value="${s.id}" ${s.id===current?'selected':''}>${s.number}. ${esc(s.name)}</option>`).join('')}</select></div>${stu?`<div class="photo-tools">${avatarHTML(stu,'large')}<label class="btn file-btn">📷 Escolher foto<input type="file" accept="image/*" hidden onchange="saveStudentPhoto('${stu.id}',this.files[0])"></label>${stu.photo?`<button class="btn danger" onclick="removeStudentPhoto('${stu.id}')">Remover foto</button>`:''}</div><p class="import-note">A fotografia é reduzida antes de ser guardada, para não ocupar demasiado espaço.</p>`:''}</div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="assignSeat('${seatId}')">Guardar lugar</button></div>`)}
function assignSeat(seatId){const sid=document.getElementById('seatStudent').value;Object.keys(state.room.seats).forEach(k=>{if(state.room.seats[k]===sid&&k!==seatId)delete state.room.seats[k]});if(sid)state.room.seats[seatId]=sid;else delete state.room.seats[seatId];saveState('Lugar guardado');closeModal();renderRoom()}
function saveStudentPhoto(sid,file){if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=180,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);const st=state.students.find(x=>x.id===sid);if(st){st.photo=c.toDataURL('image/jpeg',.72);saveState('Fotografia guardada');closeModal();render()}};img.src=r.result};r.readAsDataURL(file)}
function removeStudentPhoto(sid){const st=state.students.find(x=>x.id===sid);if(st)st.photo='';saveState('Fotografia removida');closeModal();render()}
function renderHelp(){setHeader('Ajuda','Guia rápido do PROFavalia 1.º Ciclo','',false);document.getElementById('content').innerHTML=`<div class="help-tip"><strong>Regra de segurança:</strong> a gravação local é automática. Pode também ligar o Google Drive para sincronizar entre equipamentos e deve criar regularmente uma cópia JSON em <strong>Definições</strong>.</div><div class="help-grid"><div class="card help-card"><h4>⌂ Início</h4><p>Mostra todos os alunos e as avaliações escolhidas. Pode filtrar, editar resultados e importar ou exportar a grelha.</p></div><div class="card help-card"><h4>◎ Visão do aluno</h4><p>Reúne resultados, comentários, Atitudes e Valores, sínteses e o resumo das presenças de cada período.</p></div><div class="card help-card"><h4>▦ Visão da sala</h4><p>Crie carteiras individuais ou duas a duas, atribua alunos e adicione fotografias reduzidas.</p></div><div class="card help-card"><h4>● Disciplinas</h4><p>Em Português, Matemática e Estudo do Meio pode criar, duplicar, arquivar e reordenar avaliações.</p></div><div class="card help-card"><h4>♡ Atitudes e Valores</h4><p>Escolha aluno e período. Em Pontualidade, Assiduidade, Criatividade, Relação com os outros e Cumprimento de regras pode escrever livremente ou acrescentar frases do banco. O banco é editável e existe uma síntese final por período.</p></div><div class="card help-card"><h4>✓ Presenças</h4><p>Registe diariamente Presente, Falta, Falta justificada ou Atraso. Os feriados, interrupções e encerramentos não entram nos totais. Existem resumos mensal e por período.</p></div><div class="card help-card"><h4>✎ Inovar</h4><p>Escolha aluno, disciplina, subtema e frase. Pode combinar várias frases, alterar o banco e exportar a tabela final.</p></div><div class="card help-card"><h4>♟ Alunos</h4><p>Adicione, edite, arquive e reorganize alunos. A importação Excel acrescenta ou atualiza sem apagar resultados.</p></div><div class="card help-card"><h4>⚙ Definições</h4><p>Altere turma, intervalos, calendário dos períodos, Google Drive, modelos e cópias de segurança.</p></div><div class="card help-card"><h4>☁ Google Drive</h4><p>Na primeira abertura escolha Google Drive ou armazenamento local. Todos os novos dados, incluindo Atitudes e Valores e Presenças, fazem parte da sincronização.</p></div><div class="card help-card"><h4>📱 Telemóvel</h4><p>O menu completo está fixo em baixo, em duas linhas. Presenças tem acesso direto para facilitar o registo diário.</p></div><div class="card help-card about-card"><div class="about-brand">PROF<span>avalia</span></div><div class="about-module">1.º Ciclo · versão ${APP_VERSION}</div><div class="about-signature">Criado por Tiago Oliva, professor, para outros professores.</div><p>O PROFavalia nasceu da experiência diária em contexto escolar e continua a evoluir com as sugestões e necessidades de quem o utiliza.</p><p><strong>Sugestões, melhorias ou reporte de erros</strong><br><a href="mailto:tloliva@gmail.com">tloliva@gmail.com</a></p><div class="about-footer">© 2026 Tiago Oliva · PROFavalia</div></div></div>`}
function renderSubject(subject){
  const meta=SUBJECTS[subject];setHeader(meta.name,`${state.meta.className} · avaliações e resultados`,'+ Nova avaliação',true);
  const list=allAssessments().filter(a=>a.subject===subject).sort((a,b)=>(a.order??0)-(b.order??0)||new Date(a.date)-new Date(b.date));
  const periods=[1,2,3].map(p=>{const items=list.filter(a=>Number(a.period)===p),weight=items.reduce((n,a)=>n+(Number(a.weight)||0),0);return`<div style="margin-bottom:24px"><div class="page-header"><div><h3>${p}.º período</h3><p>${items.length} avaliação${items.length===1?'':'ões'} · pesos ${weight}% ${weight&&weight!==100?'<span class="warning-inline">(ajustar para 100%)</span>':''}</p></div></div><div class="assessment-grid">${items.length?items.map(a=>assessmentCard(a)).join(''):'<div class="card empty">Ainda não existem avaliações neste período.</div>'}</div></div>`}).join('');
  document.getElementById('content').innerHTML=`<div class="page-header"><div><h3>${meta.name}</h3><p>Crie, duplique, reordene e lance resultados.</p></div><div class="data-actions"><button class="btn" onclick="openPrintModal('subject','${subject}')">🖨 Imprimir</button><button class="btn" onclick="exportSubjectWorkbook('${subject}')">⬇ Exportar Excel</button><label class="btn file-btn">↥ Importar Excel<input type="file" accept=".xlsx,.csv" hidden onchange="importSubjectExcel('${subject}',this.files[0]);this.value=''"></label><button class="btn primary" onclick="openAssessmentModal(null,'${subject}')">+ Nova avaliação</button></div></div>${periods}`;
}
function assessmentCard(a){
  const done=assessmentCompletion(a),avg=activeStudents().map(s=>a.scale==='numeric'?percent(a,s.id):({MB:95,B:80,S:60,I:35,F:10}[qualitative(a,s.id)]??null)).filter(v=>v!=null);
  const mean=avg.length?(avg.reduce((x,y)=>x+y,0)/avg.length).toFixed(1)+'%':'—';
  const domains=[...new Set((a.criteria||[]).map(c=>c.domain).filter(Boolean))];
  return`<div class="card assessment-card ${a.subject}"><div class="assessment-card-head"><span class="badge ${a.subject}">${esc(a.type)}</span><span class="weight-chip">Peso ${Number(a.weight)||0}%</span></div><h4>${esc(a.title)}</h4><p>${formatDate(a.date)} · ${a.scale==='numeric'?'Numérica':'Qualitativa'} · média ${mean}</p>${domains.length?`<p class="domain-line">${domains.map(d=>`<span>${esc(d)}</span>`).join('')}</p>`:''}<div class="progress"><span style="width:${done}%"></span></div><p>${done}% dos alunos com registo</p><div class="card-actions"><button class="btn small primary" onclick="openScoring('${a.id}')">Lançar resultados</button><button class="btn small" onclick="openAssessmentModal('${a.id}')">Editar</button><button class="btn small" onclick="duplicateAssessment('${a.id}')">Duplicar</button><button class="btn small" onclick="saveAssessmentAsTemplate('${a.id}')">Modelo</button><button class="icon-btn" title="Mover para cima" onclick="moveAssessment('${a.id}',-1)">↑</button><button class="icon-btn" title="Mover para baixo" onclick="moveAssessment('${a.id}',1)">↓</button><button class="icon-btn" title="Imprimir" onclick="openPrintModal('assessment',null,'${a.id}')">🖨</button><button class="icon-btn" title="Exportar Excel" onclick="exportAssessmentExcel('${a.id}')">⬇</button><label class="icon-btn file-btn" title="Importar Excel">↥<input type="file" accept=".xlsx,.csv" hidden onchange="importAssessmentExcel('${a.id}',this.files[0]);this.value=''"></label><button class="icon-btn" title="Arquivar" onclick="archiveAssessment('${a.id}')">⌁</button></div></div>`
}
function formatDate(d){if(!d)return'Sem data';try{return new Intl.DateTimeFormat('pt-PT').format(new Date(d+'T12:00:00'))}catch(e){return d}}
function renderStudents(){
  setHeader('Alunos',`${state.meta.className} · gestão da turma`,'+ Adicionar aluno',true);
  const rows=state.students.sort((a,b)=>(a.order??a.number)-(b.order??b.number)).map((s,i)=>`<tr><td>${s.number}</td><td><div class="student-name-cell">${avatarHTML(s)}<strong>${esc(s.name)}</strong>${s.active===false?' <span class="badge">Arquivado</span>':''}</div></td><td>${s.active===false?'Inativo':'Ativo'}</td><td class="actions"><button class="icon-btn" onclick="moveStudent('${s.id}',-1)">↑</button><button class="icon-btn" onclick="moveStudent('${s.id}',1)">↓</button><button class="btn small" onclick="openStudentModal('${s.id}')">Editar</button><button class="btn small" onclick="toggleStudent('${s.id}')">${s.active===false?'Reativar':'Arquivar'}</button><button class="btn small danger" onclick="deleteStudent('${s.id}')">Eliminar</button></td></tr>`).join('');
  document.getElementById('content').innerHTML=`<div class="page-header"><div><h3>Lista de alunos</h3><p>Adicione, altere, arquive ou reorganize a turma.</p></div><div class="data-actions"><button class="btn" onclick="openBulkStudents()">Colar lista</button><button class="btn" onclick="exportStudentsExcel()">⬇ Exportar Excel</button><label class="btn file-btn">↥ Importar Excel<input type="file" accept=".xlsx,.csv" hidden onchange="importStudentsExcel(this.files[0]);this.value=''"></label><button class="btn primary" onclick="openStudentModal()">+ Aluno</button></div></div><div class="table-wrap"><table class="students-table"><thead><tr><th>N.º</th><th>Nome</th><th>Estado</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><p class="import-note">A importação Excel atualiza alunos com o mesmo número ou nome e acrescenta os restantes. Não elimina alunos nem resultados.</p>`;
}
function openStudent(id){ui.studentId=id;go('student')}
function renderStudent(){
  const sts=activeStudents();if(!sts.length){setHeader('Visão do aluno','Sem alunos','',false);document.getElementById('content').innerHTML='<div class="card empty">Adicione primeiro um aluno.</div>';return}
  if(!sts.some(s=>s.id===ui.studentId))ui.studentId=sts[0].id;
  const s=sts.find(x=>x.id===ui.studentId);setHeader('Visão do aluno',`${s.name} · ${state.meta.className}`,'🖨 Imprimir aluno',true);
  const options=sts.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${x.number}. ${esc(x.name)}</option>`).join('');
  const panels=Object.entries(SUBJECTS).map(([k,m])=>studentSubjectPanel(s,k,m)).join('');
  const notes=state.studentNotes[s.id]||{};
  document.getElementById('content').innerHTML=`<div class="student-layout">
    <aside class="card student-side"><div class="field"><label>Escolher aluno</label><select onchange="ui.studentId=this.value;renderStudent()">${options}</select></div>
      <div style="display:flex;gap:6px;margin-top:10px"><button class="btn small" onclick="stepStudent(-1)">← Anterior</button><button class="btn small" onclick="stepStudent(1)">Seguinte →</button></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <div class="field"><label>Período</label><select id="studentPeriod" onchange="ui.studentPeriod=this.value;renderStudent()"><option value="all" ${ui.studentPeriod==='all'?'selected':''}>Todos</option><option value="1" ${String(ui.studentPeriod)==='1'?'selected':''}>1.º período</option><option value="2" ${String(ui.studentPeriod)==='2'?'selected':''}>2.º período</option><option value="3" ${String(ui.studentPeriod)==='3'?'selected':''}>3.º período</option></select></div>
      <button class="btn" style="width:100%;margin-top:12px" onclick="openPrintModal('student')">🖨 Imprimir ficha</button><button class="btn" style="width:100%;margin-top:8px" onclick="openExportModal('student',null,null,'${s.id}')">⬇ Exportar aluno</button></aside>
    <div class="student-main">
      <div class="card student-hero"><div><h3>${esc(s.name)}</h3><p>N.º ${s.number} · ${state.meta.className}</p></div><div>${Object.keys(SUBJECTS).map(k=>{const v=subjectAverage(k,s.id);return`<span class="badge ${k}" style="margin-left:5px">${SUBJECTS[k].short}: ${v==null?'—':v.toFixed(1)+'%'}</span>`}).join('')}</div></div>
      ${panels}
      <div class="student-extra-panels">${studentAttitudesPanel(s.id)}${studentAttendancePanel(s.id)}</div>
      ${studentCommentsPanel(s.id)}
      ${studentTimelinePanel(s.id)}
      ${studentInovarPanel(s.id)}
      <div class="card subject-panel"><h4>Avaliação global e observações</h4><div class="notes-grid">
        <div class="field"><label>Observação interna</label><textarea onblur="saveStudentNote('${s.id}','internal',this.value)" placeholder="Não aparece nas impressões por defeito.">${esc(notes.internal||'')}</textarea></div>
        <div class="field"><label>Texto para relatório / Inovar</label><textarea onblur="saveStudentNote('${s.id}','report',this.value)" placeholder="Síntese global do aluno.">${esc(notes.report||'')}</textarea></div>
      </div></div>
    </div></div>`;
}
function studentSubjectPanel(s,subject,m){
  const period=ui.studentPeriod||'all';
  const list=allAssessments().filter(a=>a.subject===subject&&(period==='all'||String(a.period)===String(period))).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const note=state.studentNotes[s.id]?.[subject]||'';
  const rows=list.map(a=>`<tr><td>${esc(a.title)}<div class="muted">${esc(a.type)} · ${a.period}.º período · peso ${Number(a.weight)||0}%</div></td><td>${resultText(a,s.id,'both')}</td><td>${esc(resultRecord(a,s.id)?.note||'')}</td><td><button class="btn small" onclick="openScoring('${a.id}','${s.id}')">Abrir</button></td></tr>`).join('');
  const av=subjectAverage(subject,s.id,period),domains=domainStatsForStudent(s.id,subject,period);
  return`<div class="card subject-panel subject-${subject}"><h4><span>${m.name}</span><span class="badge ${subject}">${av==null?'Sem média':av.toFixed(1)+'%'}</span></h4>
    ${domains.length?`<div class="domain-summary">${domains.map(d=>`<div><span>${esc(d.name)}</span><strong>${d.percent.toFixed(1)}%</strong><small>${d.items} critério${d.items===1?'':'s'}</small></div>`).join('')}</div>`:'<p class="muted">Ainda não há perguntas associadas a domínios com resultados.</p>'}
    <div class="table-wrap" style="box-shadow:none"><table class="student-results"><thead><tr><th>Avaliação</th><th>Resultado</th><th>Observação</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="4">Sem avaliações.</td></tr>'}</tbody></table></div>
    <div class="field" style="margin-top:12px"><label>Comentário de ${m.name}</label><textarea onblur="saveStudentNote('${s.id}','${subject}',this.value)" placeholder="Comentário da disciplina.">${esc(note)}</textarea></div></div>`
}
function stepStudent(delta){const sts=activeStudents();let i=sts.findIndex(s=>s.id===ui.studentId);i=(i+delta+sts.length)%sts.length;ui.studentId=sts[i].id;renderStudent()}
function saveStudentNote(sid,key,value){state.studentNotes[sid]=state.studentNotes[sid]||{};state.studentNotes[sid][key]=value;saveState('Comentário guardado')}
function saveAttendancePeriodDate(period,key,value){state.attendance.periodDates[period]=state.attendance.periodDates[period]||{start:'',end:''};state.attendance.periodDates[period][key]=value;saveState('Calendário das presenças atualizado')}
function renderSettings(){

  <div class="card subject-panel"><h4>Domínios por disciplina</h4><p class="muted">Separe os nomes por ponto e vírgula. Estes domínios aparecem nas perguntas e na análise do aluno.</p>${Object.entries(SUBJECTS).map(([k,m])=>`<div class="field domain-setting"><label>${m.name}</label><textarea onblur="saveDomains('${k}',this.value)">${esc((state.settings.domains[k]||[]).join('; '))}</textarea></div>`).join('')}</div>

  <div class="card subject-panel"><h4>Caixote do lixo <span class="badge">${trashCount}</span></h4><p class="muted">Alunos e avaliações eliminados podem ser recuperados.</p>${renderTrashHTML()}${trashCount?'<button class="btn danger" onclick="emptyTrash()">Esvaziar caixote</button>':'<span class="muted">O caixote está vazio.</span>'}</div>

  <div class="card about-card"><div class="about-brand">PROF<span>avalia</span></div><div class="about-module">1.º Ciclo · versão ${APP_VERSION}</div><div class="about-signature">Criado por Tiago Oliva, professor, para outros professores.</div><p>O PROFavalia nasceu da experiência diária em contexto escolar e continua a evoluir com as sugestões e necessidades de quem o utiliza.</p><p><strong>Sugestões, melhorias ou reporte de erros</strong><br><a href="mailto:tloliva@gmail.com">tloliva@gmail.com</a></p><p>Obrigado a todos os professores que utilizam o PROFavalia e partilham as suas ideias. Cada sugestão contribui para tornar esta ferramenta mais útil para todos.</p><div class="data-actions"><button class="btn" onclick="go('help')">Abrir Ajuda</button><button class="btn danger" onclick="resetDemo()">Repor modelo inicial</button></div><div class="about-footer">© 2026 Tiago Oliva · PROFavalia</div></div></div>`;
}
function saveThreshold(code,value){state.settings.thresholds[code]=Math.max(0,Math.min(100,Number(value)||0));saveState('Escala atualizada')}
function openStudentModal(id){
  const s=id?state.students.find(x=>x.id===id):{id:uid('s'),number:(Math.max(0,...state.students.map(x=>Number(x.number)||0))+1),name:'',active:true,photo:''};
  modal(`<div class="modal-head"><h3>${id?'Editar aluno':'Adicionar aluno'}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Número</label><input id="stuNum" type="number" value="${s.number}"></div><div class="field"><label>Nome</label><input id="stuName" type="text" value="${esc(s.name)}"></div></div>${id?`<div class="photo-tools">${avatarHTML(s,'large')}<label class="btn file-btn">📷 Escolher fotografia<input type="file" accept="image/*" hidden onchange="saveStudentPhoto('${s.id}',this.files[0])"></label>${s.photo?`<button class="btn danger" onclick="removeStudentPhoto('${s.id}')">Remover fotografia</button>`:''}</div>`:'<p class="import-note">Depois de criar o aluno pode adicionar uma fotografia na edição ou na Visão da Sala.</p>'}</div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveStudentModal('${s.id}',${id?'true':'false'})">Guardar</button></div>`)
}
function saveStudentModal(id,exists){const number=Number(document.getElementById('stuNum').value),name=document.getElementById('stuName').value.trim();if(!name)return toast('Indique o nome.');if(exists){const s=state.students.find(x=>x.id===id);s.number=number;s.name=name}else state.students.push({id,number,name,active:true,order:state.students.length,photo:''});saveState('Aluno guardado');closeModal();renderStudents()}
function toggleStudent(id){const s=state.students.find(x=>x.id===id);s.active=s.active===false;saveState();renderStudents()}
function deleteStudent(id){if(!confirm('Mover este aluno e os respetivos dados para o caixote? Poderá recuperá-lo nas Definições.'))return;const student=state.students.find(s=>s.id===id);if(!student)return;const results={};state.assessments.forEach(a=>{if(a.results?.[id]!==undefined){results[a.id]=deepClone(a.results[id]);delete a.results[id]}});const seats=[];Object.entries(state.room.seats||{}).forEach(([seat,sid])=>{if(sid===id){seats.push(seat);delete state.room.seats[seat]}});const attendance={};Object.entries(state.attendance.days||{}).forEach(([date,day])=>{if(day.records?.[id]){attendance[date]=deepClone(day.records[id]);delete day.records[id]}});state.trash.students.unshift({deletedAt:new Date().toISOString(),student:deepClone(student),results,notes:deepClone(state.studentNotes[id]||{}),timeline:deepClone(state.studentTimeline[id]||[]),inovar:deepClone(state.inovar.texts[id]||{}),attitudes:deepClone(state.attitudes.texts[id]||{}),attendance,seats});state.students=state.students.filter(s=>s.id!==id);delete state.studentNotes[id];delete state.studentTimeline[id];delete state.inovar.texts[id];delete state.attitudes.texts[id];saveState('Aluno movido para o caixote');renderStudents()}
function moveStudent(id,delta){const list=state.students.sort((a,b)=>(a.order??a.number)-(b.order??b.number));const i=list.findIndex(x=>x.id===id),j=i+delta;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];list.forEach((s,k)=>s.order=k);state.students=list;saveState();renderStudents()}
function openBulkStudents(){
  modal(`<div class="modal-head"><h3>Importar lista de alunos</h3><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="modal-body">
    <p class="muted">Cole um aluno por linha. Pode usar “número; nome” ou apenas o nome.</p><textarea id="bulkNames" style="width:100%;min-height:260px" placeholder="1; Ana Silva&#10;2; Bernardo Costa"></textarea></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveBulkStudents()">Adicionar</button></div>`);
}
function saveBulkStudents(){const lines=document.getElementById('bulkNames').value.split(/\n/).map(x=>x.trim()).filter(Boolean);let next=Math.max(0,...state.students.map(x=>Number(x.number)||0))+1;lines.forEach(line=>{const p=line.split(/[;\t]/);let number,name;if(p.length>1&&!isNaN(Number(p[0]))){number=Number(p.shift());name=p.join(' ').trim()}else{number=next++;name=line}state.students.push({id:uid('s'),number,name,active:true,order:state.students.length})});saveState(`${lines.length} aluno(s) adicionado(s)`);closeModal();renderStudents()}
function openAssessmentModal(id,defaultSubject){
  const a=id?deepClone(state.assessments.find(x=>x.id===id)):{id:uid('a'),subject:defaultSubject||'pt',title:'',type:'Ficha de avaliação',period:1,date:new Date().toISOString().slice(0,10),scale:'numeric',maxScore:100,weight:0,criteria:[],results:{},archived:false};
  const criteria=(a.criteria||[]).map(c=>criteriaRow(c.id,c.label,c.max,c.domain,c.learning)).join('');
  const templates=state.templates.filter(t=>t.subject==='any'||t.subject===a.subject);
  modal(`<div class="modal-head"><h3>${id?'Editar avaliação':'Nova avaliação'}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
  <div class="modal-body"><div class="template-picker"><div class="field"><label>Começar a partir de um modelo</label><select id="aTemplate"><option value="">— Sem modelo —</option>${templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><button class="btn" onclick="applyAssessmentTemplate()">Aplicar modelo</button></div><div class="form-grid">
    <div class="field wide"><label>Título</label><input id="aTitle" type="text" value="${esc(a.title)}" placeholder="Ex.: Ficha de avaliação 2"></div>
    <div class="field"><label>Disciplina</label><select id="aSubject" onchange="refreshCriteriaDomains()">${Object.entries(SUBJECTS).map(([k,v])=>`<option value="${k}" ${a.subject===k?'selected':''}>${v.name}</option>`).join('')}</select></div>
    <div class="field"><label>Tipo</label><input id="aType" type="text" value="${esc(a.type)}" list="typesList"><datalist id="typesList"><option>Ficha de avaliação</option><option>Questão-aula</option><option>Leitura</option><option>Ditado</option><option>Produção escrita</option><option>Cálculo mental</option><option>Resolução de problemas</option><option>Projeto</option><option>Apresentação</option></datalist></div>
    <div class="field"><label>Período</label><select id="aPeriod">${[1,2,3].map(p=>`<option value="${p}" ${Number(a.period)===p?'selected':''}>${p}.º período</option>`).join('')}</select></div>
    <div class="field"><label>Data</label><input id="aDate" type="date" value="${a.date||''}"></div>
    <div class="field"><label>Escala</label><select id="aScale" onchange="toggleCriteriaArea()"><option value="numeric" ${a.scale==='numeric'?'selected':''}>Numérica</option><option value="qualitative" ${a.scale==='qualitative'?'selected':''}>Qualitativa</option></select></div>
    <div class="field"><label>Peso no período (%)</label><input id="aWeight" type="number" min="0" max="100" step="1" value="${Number(a.weight)||0}"><small class="muted">0 = não entra na média ponderada</small></div>
    <div class="field"><label>Cotação total (sem critérios)</label><input id="aMax" type="number" value="${a.maxScore||100}"></div>
    <div class="wide" id="criteriaArea"><div style="display:flex;justify-content:space-between;align-items:center"><strong>Perguntas / critérios, domínios e aprendizagens</strong><button class="btn small" onclick="addCriteriaRow()">+ Adicionar</button></div>
      <p class="muted">Quando existem critérios, o total é calculado pela soma das cotações. O domínio permite analisar as aprendizagens na visão do aluno.</p><div id="criteriaRows">${criteria}</div></div>
    <label class="check wide"><input id="aSaveTemplate" type="checkbox"> Guardar também esta estrutura como modelo reutilizável</label>
  </div></div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button>${id?`<button class="btn danger" onclick="deleteAssessment('${a.id}')">Mover para o caixote</button>`:''}<button class="btn primary" onclick="saveAssessmentModal('${a.id}',${id?'true':'false'})">Guardar</button></div>`);
  toggleCriteriaArea();
}
function criteriaRow(id,label='',max='',domain='',learning=''){const subj=document.getElementById('aSubject')?.value||ui.subject||'pt',domains=state.settings.domains[subj]||[];return`<div class="criteria-row enriched" data-id="${id||uid('c')}"><input class="crit-label" type="text" value="${esc(label)}" placeholder="Pergunta / critério"><input class="crit-max" type="number" value="${max}" placeholder="Cotação"><input class="crit-domain" type="text" list="domainList_${subj}" value="${esc(domain)}" placeholder="Domínio"><input class="crit-learning" type="text" value="${esc(learning)}" placeholder="Aprendizagem / objetivo"><button class="icon-btn" onclick="this.parentElement.remove()">✕</button><datalist id="domainList_${subj}">${domains.map(d=>`<option value="${esc(d)}"></option>`).join('')}</datalist></div>`}
function addCriteriaRow(){document.getElementById('criteriaRows').insertAdjacentHTML('beforeend',criteriaRow(uid('c')))}
function toggleCriteriaArea(){document.getElementById('criteriaArea')?.classList.toggle('hidden',document.getElementById('aScale')?.value!=='numeric')}
function saveAssessmentModal(id,exists){
  const title=document.getElementById('aTitle').value.trim();if(!title)return toast('Indique um título.');
  const criteria=[...document.querySelectorAll('.criteria-row')].map(r=>({id:r.dataset.id,label:r.querySelector('.crit-label').value.trim()||'Critério',max:Number(r.querySelector('.crit-max').value)||0,domain:r.querySelector('.crit-domain')?.value.trim()||'',learning:r.querySelector('.crit-learning')?.value.trim()||''})).filter(c=>c.max>0);
  const data={id,title,subject:document.getElementById('aSubject').value,type:document.getElementById('aType').value.trim()||'Avaliação',period:Number(document.getElementById('aPeriod').value),date:document.getElementById('aDate').value,scale:document.getElementById('aScale').value,maxScore:Number(document.getElementById('aMax').value)||100,weight:Math.max(0,Number(document.getElementById('aWeight').value)||0),criteria,archived:false};
  if(exists){const idx=state.assessments.findIndex(a=>a.id===id);data.results=state.assessments[idx].results||{};data.order=state.assessments[idx].order;state.assessments[idx]=data}
  else{data.results={};data.order=state.assessments.filter(a=>a.subject===data.subject).length;state.assessments.push(data);ui.global.selected.push(id)}
  if(document.getElementById('aSaveTemplate')?.checked)createTemplateFromAssessment(data);
  saveState('Avaliação guardada');closeModal();if(ui.view==='subject')renderSubject(data.subject);else render();
}
function duplicateAssessment(id){const a=deepClone(state.assessments.find(x=>x.id===id));a.id=uid('a');a.title+=' — cópia';a.results={};a.order=(a.order??0)+1;state.assessments.push(a);ui.global.selected.push(a.id);saveState('Avaliação duplicada');renderSubject(a.subject)}
function archiveAssessment(id){const a=state.assessments.find(x=>x.id===id);if(!confirm(`Arquivar “${a.title}”?`))return;a.archived=true;saveState('Avaliação arquivada');renderSubject(a.subject)}
function deleteAssessment(id){if(!confirm('Mover esta avaliação para o caixote? Poderá recuperá-la nas Definições.'))return;const a=state.assessments.find(x=>x.id===id);if(!a)return;state.trash.assessments.unshift({deletedAt:new Date().toISOString(),assessment:deepClone(a)});state.assessments=state.assessments.filter(x=>x.id!==id);ui.global.selected=ui.global.selected.filter(x=>x!==id);saveState('Avaliação movida para o caixote');closeModal();renderSubject(a.subject)}
function moveAssessment(id,delta){const a=state.assessments.find(x=>x.id===id);const list=state.assessments.filter(x=>x.subject===a.subject&&!x.archived).sort((x,y)=>(x.order??0)-(y.order??0));const i=list.findIndex(x=>x.id===id),j=i+delta;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];list.forEach((x,k)=>x.order=k);saveState();renderSubject(a.subject)}
function openScoring(id,focusStudent){
  const a=state.assessments.find(x=>x.id===id);const sts=activeStudents();
  let heads='',rows='';
  if(a.scale==='numeric'&&a.criteria?.length)heads=a.criteria.map(c=>`<th title="${esc(c.label)}">${esc(shortTitle(c.label))}<div class="muted">/${c.max}</div></th>`).join('');else heads='<th>Resultado</th>';
  rows=sts.map(s=>{const r=a.results[s.id]||{status:'normal',items:{},value:'',note:''};let fields='';if(a.scale==='qualitative')fields=`<td><select onchange="updateQual('${a.id}','${s.id}',this.value)"><option value="">—</option>${Object.entries(QUAL).map(([k,v])=>`<option value="${k}" ${r.value===k?'selected':''}>${k} — ${v}</option>`).join('')}</select></td>`;else if(a.criteria?.length)fields=a.criteria.map(c=>`<td><input type="number" min="0" max="${c.max}" step="0.5" value="${r.items?.[c.id]??''}" onchange="updateItem('${a.id}','${s.id}','${c.id}',this.value)"></td>`).join('');else fields=`<td><input type="number" min="0" max="${a.maxScore}" step="0.5" value="${r.value??''}" onchange="updateDirect('${a.id}','${s.id}',this.value)"></td>`;return`<tr id="score_${s.id}" ${focusStudent===s.id?'style="outline:3px solid #b8c7ff"':''}><td class="sticky-num">${s.number}</td><td class="sticky-name">${esc(s.name)}</td>${fields}<td id="total_${s.id}">${resultText(a,s.id,'both')}</td><td><select onchange="updateStatus('${a.id}','${s.id}',this.value)"><option value="normal" ${!r.status||r.status==='normal'?'selected':''}>Normal</option><option value="absent" ${r.status==='absent'?'selected':''}>Falta</option><option value="notdone" ${r.status==='notdone'?'selected':''}>Não realizado</option></select></td><td><textarea style="min-width:210px;min-height:58px;resize:vertical" onblur="updateResultNote('${a.id}','${s.id}',this.value)" placeholder="Comentário / observação desta avaliação">${esc(r.note||'')}</textarea></td></tr>`}).join('');
  const cards=sts.map(s=>mobileScoreCard(a,s,focusStudent)).join('');
  modal(`<div class="modal large"><div class="modal-head"><div><h3>${esc(a.title)}</h3><span class="badge ${a.subject}">${SUBJECTS[a.subject].name}</span> <span class="muted">${a.period}.º período</span></div><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="table-wrap desktop-score-table"><table class="scoring-table"><thead><tr><th class="sticky-num">N.º</th><th class="sticky-name">Aluno</th>${heads}<th>Total</th><th>Estado</th><th>Observação</th></tr></thead><tbody>${rows}</tbody></table></div><div class="mobile-score-list">${cards}</div></div><div class="modal-foot"><button class="btn" onclick="openPrintModal('assessment',null,'${a.id}')">🖨 Imprimir</button><button class="btn" onclick="exportAssessmentExcel('${a.id}')">⬇ Exportar Excel</button><label class="btn file-btn">↥ Importar Excel<input type="file" accept=".xlsx,.csv" hidden onchange="importAssessmentExcel('${a.id}',this.files[0]);this.value=''"></label><button class="btn primary" onclick="closeModal();render()">Concluir</button></div></div>`,true);
  if(focusStudent)setTimeout(()=>document.getElementById('score_'+focusStudent)?.scrollIntoView({block:'center'}),30);
}

function printGlobalHTML(period){

}
function plainResult(a,sid){const r=resultRecord(a,sid);if(r?.status==='absent')return'Falta';if(r?.status==='notdone')return'N/R';if(a.scale==='qualitative')return esc(r?.value||'—');const p=percent(a,sid);return p==null?'—':p.toFixed(1)+'% ('+mention(p)+')'}

function printStudentHTML(sid,period,notes){

function ensureInovarText(sid,scope){state.inovar=state.inovar||{phraseBank:deepClone(DEFAULT_INOVAR_BANK),texts:{}};state.inovar.texts=state.inovar.texts||{};state.inovar.texts[sid]=state.inovar.texts[sid]||{};return state.inovar.texts[sid][scope]||''}
function getInovarSubthemes(scope){const area=state.inovar?.phraseBank?.[scope]||{};return Object.keys(area)}
function currentInovarSubtheme(scope){ui.inovarSubtheme=ui.inovarSubtheme||{};const subs=getInovarSubthemes(scope);if(!subs.length){state.inovar.phraseBank[scope]={'Geral':[]};ui.inovarSubtheme[scope]='Geral';return'Geral'}if(!subs.includes(ui.inovarSubtheme[scope]))ui.inovarSubtheme[scope]=subs[0];return ui.inovarSubtheme[scope]}

function localDateISO(date=new Date()){const d=new Date(date);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function ensureAttitudePeriod(sid,period){state.attitudes=state.attitudes||{phraseBank:deepClone(DEFAULT_ATTITUDE_BANK),texts:{}};state.attitudes.texts=state.attitudes.texts||{};state.attitudes.texts[sid]=state.attitudes.texts[sid]||{};state.attitudes.texts[sid][period]=state.attitudes.texts[sid][period]||{};const x=state.attitudes.texts[sid][period];Object.keys(ATTITUDE_TOPICS).forEach(k=>{if(typeof x[k]!=='string')x[k]=''});if(typeof x.summary!=='string')x.summary='';return x}
function saveAttitudeText(sid,period,key,value){ensureAttitudePeriod(sid,period)[key]=value;saveState('Atitudes e Valores guardados')}
function addSelectedAttitudePhrase(topic){const sid=ui.attitudesStudentId,period=ui.attitudesPeriod,sel=document.getElementById(`attPhrase_${topic}`);if(!sel||sel.value==='')return toast('Escolha uma frase.');const idx=Number(sel.value);const phrase=state.attitudes.phraseBank[topic]?.[idx];if(!phrase)return;const x=ensureAttitudePeriod(sid,period),current=x[topic]?.trim();x[topic]=(current?current+' ':'')+phrase;saveState('Frase adicionada');renderAttitudes()}
function addAttitudePhrase(topic){const value=prompt(`Nova frase — ${ATTITUDE_TOPICS[topic].label}:`,'');if(!value?.trim())return;state.attitudes.phraseBank[topic].push(value.trim());saveState('Frase criada');renderAttitudes()}
function editAttitudePhrase(topic){const sel=document.getElementById(`attPhrase_${topic}`);if(!sel||sel.value==='')return toast('Escolha uma frase para editar.');const idx=Number(sel.value);const old=state.attitudes.phraseBank[topic][idx],value=prompt('Editar frase:',old);if(value===null)return;if(!value.trim())return toast('A frase não pode ficar vazia.');state.attitudes.phraseBank[topic][idx]=value.trim();saveState('Frase atualizada');renderAttitudes()}
function deleteAttitudePhrase(topic){const sel=document.getElementById(`attPhrase_${topic}`);if(!sel||sel.value==='')return toast('Escolha uma frase para eliminar.');const idx=Number(sel.value);if(!confirm('Eliminar esta frase do banco? Os textos já usados não são alterados.'))return;state.attitudes.phraseBank[topic].splice(idx,1);saveState('Frase eliminada');renderAttitudes()}
function composeAttitudeSummary(sid=ui.attitudesStudentId,period=ui.attitudesPeriod){if(!sid)return;const x=ensureAttitudePeriod(sid,period),parts=Object.keys(ATTITUDE_TOPICS).map(k=>x[k]?.trim()).filter(Boolean);if(!parts.length)return toast('Ainda não existem textos para criar a síntese.');x.summary=parts.join(' ');saveState('Síntese criada');if(ui.view==='attitudes')renderAttitudes()}
function attitudePeriodOverview(sid,period){const x=ensureAttitudePeriod(sid,period);return x.summary||Object.keys(ATTITUDE_TOPICS).map(k=>x[k]).filter(Boolean).join(' ')}
function attitudeEvidenceHint(sid,period,topic){const x=attendanceSummaryForStudent(sid,{period});if(topic==='attendance')return `Dados registados: ${x.F} falta${x.F===1?'':'s'}, ${x.J} justificada${x.J===1?'':'s'} e ${x.A} atraso${x.A===1?'':'s'}.`;if(topic==='punctuality')return `Dados registados: ${x.A} atraso${x.A===1?'':'s'} no período.`;return''}

function periodFromAttendanceDate(date){for(const p of [1,2,3]){const cfg=state.attendance.periodDates[p]||{};if(cfg.start&&cfg.end&&date>=cfg.start&&date<=cfg.end)return p}return Number(ui.attendancePeriod)||1}
function ensureAttendanceDay(date){state.attendance=state.attendance||{days:{},periodDates:{}};state.attendance.days=state.attendance.days||{};if(!state.attendance.days[date])state.attendance.days[date]={period:periodFromAttendanceDate(date),type:'normal',records:{}};const d=state.attendance.days[date];d.records=d.records||{};d.period=Number(d.period)||periodFromAttendanceDate(date);d.type=ATTENDANCE_DAY_TYPES[d.type]?d.type:'normal';return d}
function changeAttendanceDate(value){ui.attendanceDate=value||localDateISO();const existing=state.attendance.days[ui.attendanceDate];ui.attendancePeriod=existing?.period||periodFromAttendanceDate(ui.attendanceDate);ui.attendanceMonth=ui.attendanceDate.slice(0,7);renderAttendance()}
function stepAttendanceDate(delta){const d=new Date((ui.attendanceDate||localDateISO())+'T12:00:00');d.setDate(d.getDate()+delta);changeAttendanceDate(localDateISO(d))}
function setAttendancePeriod(value){ui.attendancePeriod=Number(value)||1;const day=ensureAttendanceDay(ui.attendanceDate);day.period=ui.attendancePeriod;saveState('Período da presença atualizado');renderAttendance()}
function setAttendanceDayType(value){const day=ensureAttendanceDay(ui.attendanceDate);day.type=value;saveState('Tipo de dia atualizado');renderAttendance()}
function updateAttendanceStatus(sid,value){const day=ensureAttendanceDay(ui.attendanceDate);day.records[sid]=day.records[sid]||{status:'',note:''};day.records[sid].status=value;saveState('Presença atualizada')}
function updateAttendanceNote(sid,value){const day=ensureAttendanceDay(ui.attendanceDate);day.records[sid]=day.records[sid]||{status:'',note:''};day.records[sid].note=value;saveState('Observação da presença guardada')}
function markAllPresent(){if(ui.view!=='attendance')return;const day=ensureAttendanceDay(ui.attendanceDate);if(day.type!=='normal')return toast('Altere primeiro o tipo para Dia letivo.');activeStudents().forEach(s=>{day.records[s.id]=day.records[s.id]||{status:'',note:''};day.records[s.id].status='P'});saveState('Todos marcados como presentes');renderAttendance()}
function attendanceRecordsFiltered({period='all',month=''}){return Object.entries(state.attendance.days||{}).filter(([date,day])=>day.type==='normal'&&(period==='all'||Number(day.period)===Number(period))&&(!month||date.startsWith(month)))}
function attendanceSummaryForStudent(sid,{period='all',month=''}={}){const out={P:0,F:0,J:0,A:0,totalDays:0};attendanceRecordsFiltered({period,month}).forEach(([date,day])=>{out.totalDays++;const st=day.records?.[sid]?.status;if(out[st]!==undefined)out[st]++});return out}
function attendanceSummaryTable(mode='month'){const sts=activeStudents(),filter=mode==='month'?{month:ui.attendanceMonth}:{period:ui.attendanceSummaryPeriod};return`<div class="table-wrap" style="box-shadow:none"><table><thead><tr><th>N.º</th><th>Aluno</th><th>Presentes</th><th>Faltas</th><th>Justificadas</th><th>Atrasos</th></tr></thead><tbody>${sts.map(s=>{const x=attendanceSummaryForStudent(s.id,filter);return`<tr><td>${s.number}</td><td class="name">${esc(s.name)}</td><td>${x.P}</td><td>${x.F}</td><td>${x.J}</td><td>${x.A}</td></tr>`}).join('')}</tbody></table></div>`}

ax-width:220px;margin-bottom:10px"><label>Mês</label><input type="month" value="${ui.attendanceMonth}" onchange="ui.attendanceMonth=this.value;renderAttendance()"></div>${attendanceSummaryTable('month')}</section><section class="card attendance-summary-card"><h4>Resumo do período</h4><div class="field" style="max-width:220px;margin-bottom:10px"><label>Período</label><select onchange="ui.attendanceSummaryPeriod=Number(this.value);renderAttendance()">${[1,2,3].map(p=>`<option value="${p}" ${p===ui.attendanceSummaryPeriod?'selected':''}>${p}.º período</option>`).join('')}</select></div>${attendanceSummaryTable('period')}</section></div><div class="data-actions" style="margin-top:14px"><button class="btn" onclick="openPrintModal('attendance')">🖨 Imprimir presenças</button><button class="btn" onclick="downloadXlsx([attendanceSheet(),attendanceSummarySheet()],\`presencas_${safeFile(state.meta.className)}_${dateStamp()}.xlsx\`)">⬇ Exportar Excel</button></div>`

function saveInovarText(sid,scope,value){state.inovar.texts[sid]=state.inovar.texts[sid]||{};state.inovar.texts[sid][scope]=value;saveState()}
function addSelectedInovarPhrase(){const sel=document.getElementById('inovarPhrase'),i=Number(sel.value);if(sel.value==='')return toast('Escolha uma frase.');const scope=ui.inovarScope,subtheme=currentInovarSubtheme(scope),phrase=state.inovar.phraseBank[scope][subtheme][i],current=ensureInovarText(ui.inovarStudentId,scope).trim();state.inovar.texts[ui.inovarStudentId][scope]=(current?current+' ':'')+phrase;saveState('Frase adicionada');renderInovar()}
function updatePhraseBank(i,value){const scope=ui.inovarScope,subtheme=currentInovarSubtheme(scope),v=value.trim();if(!v)return deletePhraseBank(i);state.inovar.phraseBank[scope][subtheme][i]=v;saveState('Banco de frases atualizado')}
function deletePhraseBank(i){const scope=ui.inovarScope,subtheme=currentInovarSubtheme(scope);state.inovar.phraseBank[scope][subtheme].splice(i,1);saveState('Frase removida');renderInovar()}
function addPhraseBank(){const scope=ui.inovarScope,subtheme=currentInovarSubtheme(scope);state.inovar.phraseBank[scope][subtheme].push('Nova frase');saveState();renderInovar()}
function addInovarSubtheme(){const scope=ui.inovarScope,name=(prompt('Nome do novo subtema:')||'').trim();if(!name)return;if(state.inovar.phraseBank[scope][name])return alert('Já existe um subtema com esse nome.');state.inovar.phraseBank[scope][name]=[];ui.inovarSubtheme[scope]=name;saveState('Subtema criado');renderInovar()}

function normHeader(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9%]+/g,' ').trim()}
function headerIndex(headers,...names){const hs=headers.map(normHeader);for(const n of names){const q=normHeader(n),i=hs.findIndex(h=>h===q||h.startsWith(q));if(i>=0)return i}return-1}

function importAssessmentRows(a,rows){if(!rows||rows.length<2)return 0;const h=rows[0],statusI=headerIndex(h,'estado'),noteI=headerIndex(h,'comentario','observacao'),pctI=headerIndex(h,'resultado %','resultado (%)','percentagem'),resultI=headerIndex(h,'resultado','valor','nota');let count=0;rows.slice(1).forEach(row=>{const stu=findStudentByRow(row,h);if(!stu)return;const r=ensureRecord(a,stu.id);if(statusI>=0){const st=normHeader(row[statusI]);r.status=st.includes('falta')?'absent':st.includes('nao realizado')?'notdone':'normal'}if(noteI>=0)r.note=String(row[noteI]??'');if(a.scale==='qualitative'){const raw=String(row[resultI]??'').trim();const code=Object.keys(QUAL).find(k=>k===raw.toUpperCase()||normHeader(QUAL[k])===normHeader(raw));if(code)r.value=code}else if(a.criteria?.length){let has=false;a.criteria.forEach(c=>{const ci=h.findIndex(x=>normHeader(x).startsWith(normHeader(c.label)));if(ci>=0&&row[ci]!==''&&row[ci]!=null){r.items[c.id]=Number(row[ci]);has=true}});if(has)delete r.overridePercent;else if(pctI>=0&&row[pctI]!==''&&row[pctI]!=null)r.overridePercent=Number(row[pctI]);else if(resultI>=0&&row[resultI]!==''&&row[resultI]!=null)r.overridePercent=Number(row[resultI])}else{const vi=h.findIndex(x=>normHeader(x).startsWith('valor'));if(vi>=0&&row[vi]!==''&&row[vi]!=null)r.value=Number(row[vi]);else if(pctI>=0&&row[pctI]!==''&&row[pctI]!=null)r.value=Number(row[pctI])*(Number(a.maxScore)||100)/100;else if(resultI>=0&&row[resultI]!==''&&row[resultI]!=null)r.value=Number(row[resultI])}count++});return count}

function deleteTemplate(id){if(!confirm('Eliminar este modelo?'))return;state.templates=state.templates.filter(t=>t.id!==id);saveState('Modelo eliminado');renderSettings()}
function applyAssessmentTemplate(){const id=document.getElementById('aTemplate')?.value,t=state.templates.find(x=>x.id===id);if(!t)return toast('Escolha um modelo.');document.getElementById('aType').value=t.type||'Avaliação';document.getElementById('aScale').value=t.scale||'numeric';document.getElementById('aMax').value=t.maxScore||100;document.getElementById('aWeight').value=t.weight||0;document.getElementById('criteriaRows').innerHTML=(t.criteria||[]).map(c=>criteriaRow(uid('c'),c.label,c.max,c.domain,c.learning)).join('');toggleCriteriaArea();toast('Modelo aplicado.')}
function refreshCriteriaDomains(){const rows=[...document.querySelectorAll('.criteria-row')].map(r=>({id:r.dataset.id,label:r.querySelector('.crit-label').value,max:r.querySelector('.crit-max').value,domain:r.querySelector('.crit-domain')?.value||'',learning:r.querySelector('.crit-learning')?.value||''}));document.getElementById('criteriaRows').innerHTML=rows.map(c=>criteriaRow(c.id,c.label,c.max,c.domain,c.learning)).join('')}
function saveDomains(subject,value){state.settings.domains[subject]=String(value||'').split(';').map(x=>x.trim()).filter(Boolean);saveState('Domínios guardados')}
function domainStatsForStudent(sid,subject,period='all'){const map={};allAssessments().filter(a=>a.subject===subject&&(period==='all'||String(a.period)===String(period))&&a.scale==='numeric').forEach(a=>{const r=resultRecord(a,sid);if(!r||r.status&&r.status!=='normal')return;(a.criteria||[]).forEach(c=>{if(!c.domain)return;const v=Number(r.items?.[c.id]);if(!Number.isFinite(v)||!Number(c.max))return;map[c.domain]=map[c.domain]||{earned:0,max:0,items:0};map[c.domain].earned+=v;map[c.domain].max+=Number(c.max);map[c.domain].items++})});return Object.entries(map).map(([name,x])=>({name,percent:x.max?x.earned/x.max*100:0,items:x.items})).sort((a,b)=>a.name.localeCompare(b.name,'pt'))}
function periodWeight(subject,period){return allAssessments().filter(a=>a.subject===subject&&Number(a.period)===Number(period)).reduce((n,a)=>n+(Number(a.weight)||0),0)}
function appWarnings(){const w=[],sts=activeStudents(),ass=allAssessments();const noDate=ass.filter(a=>!a.date).length;if(noDate)w.push(`${noDate} avaliação${noDate===1?' sem data':'ões sem data'}`);let partial=0,missing=0;ass.forEach(a=>{let m=0;sts.forEach(s=>{const r=resultRecord(a,s.id);if(!r||(!r.status||r.status==='normal')&&((a.scale==='qualitative'&&!r.value)||(a.scale==='numeric'&&percent(a,s.id)==null)))m++});if(m){partial++;missing+=m}});if(partial)w.push(`${partial} avaliação${partial===1?'':'ões'} com ${missing} resultado${missing===1?'':'s'} em falta`);Object.keys(SUBJECTS).forEach(sub=>[1,2,3].forEach(p=>{const total=periodWeight(sub,p);if(total&&total!==100)w.push(`${SUBJECTS[sub].name}, ${p}.º período: pesos totalizam ${total}%`)}));let over=0,bad=0;ass.forEach(a=>{if(a.scale==='numeric'&&(a.criteria||[]).some(c=>Number(c.max)<=0))bad++;Object.values(a.results||{}).forEach(r=>{if(a.criteria?.length)(a.criteria||[]).forEach(c=>{if(Number(r.items?.[c.id])>Number(c.max))over++});else if(Number(r.value)>Number(a.maxScore))over++})});if(bad)w.push(`${bad} avaliação${bad===1?' com cotação inválida':'ões com cotações inválidas'}`);if(over)w.push(`${over} nota${over===1?' acima da cotação':'s acima da cotação'}`);if(storageMode()==='drive'&&!tokenValid())w.push('Google Drive escolhido, mas ainda não ligado nesta sessão');return w}
function renderWarningsPanel(){const w=appWarnings();if(!w.length)return'<div class="card ok-panel">✓ Não foram encontrados avisos importantes.</div>';return`<details class="card warnings-panel" open><summary>⚠ ${w.length} aviso${w.length===1?'':'s'} a rever</summary><div>${w.slice(0,10).map(x=>`<p>• ${esc(x)}</p>`).join('')}</div></details>`}
function renderTrashHTML(){const stu=state.trash.students.map((x,i)=>`<div class="trash-row"><span>Aluno: <strong>${esc(x.student.name)}</strong></span><button class="btn small" onclick="restoreTrashStudent(${i})">Recuperar</button></div>`).join(''),ass=state.trash.assessments.map((x,i)=>`<div class="trash-row"><span>Avaliação: <strong>${esc(x.assessment.title)}</strong></span><button class="btn small" onclick="restoreTrashAssessment(${i})">Recuperar</button></div>`).join('');return stu+ass}
function restoreTrashStudent(i){const x=state.trash.students.splice(i,1)[0];if(!x)return;state.students.push(x.student);Object.entries(x.results||{}).forEach(([aid,r])=>{const a=state.assessments.find(z=>z.id===aid);if(a){a.results=a.results||{};a.results[x.student.id]=r}});state.studentNotes[x.student.id]=x.notes||{};state.studentTimeline[x.student.id]=x.timeline||[];state.inovar.texts[x.student.id]=x.inovar||{};state.attitudes.texts[x.student.id]=x.attitudes||{};Object.entries(x.attendance||{}).forEach(([date,r])=>{const day=ensureAttendanceDay(date);day.records[x.student.id]=r});(x.seats||[]).forEach(seat=>state.room.seats[seat]=x.student.id);saveState('Aluno recuperado');renderSettings()}
function restoreTrashAssessment(i){const x=state.trash.assessments.splice(i,1)[0];if(!x)return;state.assessments.push(x.assessment);ui.global.selected.push(x.assessment.id);saveState('Avaliação recuperada');renderSettings()}
function emptyTrash(){if(!confirm('Esvaziar definitivamente o caixote? Esta ação não pode ser anulada através do caixote.'))return;state.trash={students:[],assessments:[]};saveState('Caixote esvaziado');renderSettings()}
function openRoomScore(sid,aid){const s=state.students.find(x=>x.id===sid),a=state.assessments.find(x=>x.id===aid);if(!s||!a)return;const r=a.results?.[sid]||{status:'normal',items:{},value:'',note:''};let fields='';if(a.scale==='qualitative')fields=`<div class="field"><label>Resultado</label><select onchange="updateQual('${a.id}','${s.id}',this.value)"><option value="">—</option>${Object.entries(QUAL).map(([k,v])=>`<option value="${k}" ${r.value===k?'selected':''}>${k} — ${v}</option>`).join('')}</select></div>`;else if(a.criteria?.length)fields=`<div class="mobile-criteria">${a.criteria.map(c=>`<div class="field"><label>${esc(c.label)} / ${c.max}${c.domain?' · '+esc(c.domain):''}</label><input type="number" min="0" max="${c.max}" step="0.5" value="${r.items?.[c.id]??''}" onchange="updateItem('${a.id}','${s.id}','${c.id}',this.value)"></div>`).join('')}</div>`;else fields=`<div class="field"><label>Resultado / ${a.maxScore}</label><input type="number" min="0" max="${a.maxScore}" step="0.5" value="${r.value??''}" onchange="updateDirect('${a.id}','${s.id}',this.value)"></div>`;modal(`<div class="modal-head"><div><h3>${esc(s.name)}</h3><span class="badge ${a.subject}">${esc(a.title)}</span></div><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="modal-body room-score-modal">${fields}<div class="field"><label>Estado</label><select onchange="updateStatus('${a.id}','${s.id}',this.value)"><option value="normal" ${!r.status||r.status==='normal'?'selected':''}>Normal</option><option value="absent" ${r.status==='absent'?'selected':''}>Falta</option><option value="notdone" ${r.status==='notdone'?'selected':''}>Não realizado</option></select></div><div class="field"><label>Comentário / observação</label><textarea onblur="updateResultNote('${a.id}','${s.id}',this.value)">${esc(r.note||'')}</textarea></div><div class="quick-result">Resultado: <span id="total_room_${s.id}">${resultText(a,s.id,'both')}</span></div></div><div class="modal-foot"><button class="btn" onclick="stepRoomStudent('${sid}','${aid}',-1)">← Anterior</button><button class="btn" onclick="stepRoomStudent('${sid}','${aid}',1)">Seguinte →</button><button class="btn primary" onclick="closeModal();renderRoom()">Concluir</button></div>`)}
function stepRoomStudent(sid,aid,dir){const sts=activeStudents(),i=sts.findIndex(s=>s.id===sid),n=sts[(i+dir+sts.length)%sts.length];if(n)openRoomScore(n.id,aid)}
function showExitConfirmation(){modal(`<div class="modal-head"><h3>Sair da aplicação?</h3></div><div class="modal-body"><p>Os dados foram guardados localmente${tokenValid()?' e estão a sincronizar com o Google Drive':''}.</p><p class="muted">Quer continuar na aplicação ou sair?</p></div><div class="modal-foot"><button class="btn primary" onclick="closeModal()">Continuar na aplicação</button><button class="btn danger" onclick="confirmExitApp()">Sair</button></div>`)}
function restoreBackGuard(){try{history.pushState({avaliaGuard:true},'',location.href);backGuardActive=true}catch(e){}}
function initBackProtection(){try{history.replaceState({avaliaRoot:true},'',location.href);restoreBackGuard()}catch(e){}}
function handleBackNavigation(){if(allowPageExit)return;restoreBackGuard();if(document.getElementById('modalRoot')?.innerHTML){closeModal();return}if(ui.view!=='global'){go('global');return}if(state.settings?.exitProtection)showExitConfirmation();else confirmExitApp()}
function confirmExitApp(){allowPageExit=true;exitArmed=true;closeModal();setTimeout(()=>{try{history.go(-2)}catch(e){history.back()}},0)}

function resetDemo(){if(!confirm('Repor o modelo inicial? Os dados atuais serão substituídos. Grave primeiro uma cópia de segurança.'))return;state=normalizeState(deepClone(DEMO));ui.global.selected=[];initializeSelection();saveState('Modelo inicial reposto');render()}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view,b.dataset.subject)));
document.querySelector('.mobile-nav button[data-view="global"]')?.classList.add('active');
render();
updateStorageModeUI();
initGoogleDrive();
initBackProtection();
setTimeout(showInitialStoragePrompt,450);
window.addEventListener('online',()=>{if(tokenValid())scheduleDriveSave();else if(storageMode()==='drive')updateStorageModeUI()});
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(err){}}});
window.addEventListener('pagehide',()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(err){}});
window.addEventListener('beforeunload',e=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(err){}if(state.settings?.exitProtection&&!allowPageExit){e.preventDefault();e.returnValue=''}});
window.addEventListener('popstate',handleBackNavigation);
</script>
</body></html>
